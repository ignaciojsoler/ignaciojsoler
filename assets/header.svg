<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ignacio Soler — Full-Stack Engineer">
  <defs>
    <radialGradient id="glow" cx="82%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#d8ff3e" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#d8ff3e" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#d8ff3e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08090c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#08090c" stop-opacity="1"/>
    </linearGradient>
    <style>
      .name{font:800 76px 'Inter Tight','Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#f4f4f2;letter-spacing:-2.5px}
      .role{font:500 26px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#f4f4f2;opacity:.82}
      .mono{font:500 14px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#f4f4f2;opacity:.55;letter-spacing:2px}
      .accent{fill:#d8ff3e}
      .chip{font:500 15px 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;fill:#f4f4f2}
      .reveal{opacity:0;animation:in .9s cubic-bezier(.22,1,.36,1) forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}
      @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="360" rx="18" fill="#08090c"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="18" fill="url(#glow)"/>
  <rect y="220" width="1200" height="140" fill="url(#fade)"/>

  <!-- eyebrow -->
  <g class="reveal d1">
    <circle class="accent pulse" cx="66" cy="84" r="6"/>
    <text class="mono" x="84" y="89">OPEN TO REMOTE ROLES — SANTA FE, ARGENTINA</text>
  </g>

  <!-- name -->
  <text class="name reveal d2" x="56" y="178">Ignacio Soler<tspan class="accent">.</tspan></text>

  <!-- role -->
  <text class="role reveal d3" x="60" y="224">Full-Stack Engineer · AI Engineering · UX/UI<tspan class="accent blink" dx="6">_</tspan></text>

  <!-- chips -->
  <g transform="translate(60 262)"><g class="reveal d4">
    <rect width="92" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".18"/>
    <text class="chip" x="46" y="23" text-anchor="middle">React</text>
    <rect x="104" width="104" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".18"/>
    <text class="chip" x="156" y="23" text-anchor="middle">Next.js</text>
    <rect x="220" width="104" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".18"/>
    <text class="chip" x="272" y="23" text-anchor="middle">Node.js</text>
    <rect x="336" width="132" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".18"/>
    <text class="chip" x="402" y="23" text-anchor="middle">TypeScript</text>
    <rect x="480" width="96" height="36" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".18"/>
    <text class="chip" x="528" y="23" text-anchor="middle">Python</text>
    <rect x="588" width="112" height="36" rx="18" fill="#d8ff3e"/>
    <text class="chip" x="644" y="23" text-anchor="middle" style="fill:#08090c;font-weight:700">RAG · LLMs</text>
  </g></g>

  <!-- monogram -->
  <g transform="translate(1000 110)"><g class="reveal d3">
    <rect width="140" height="140" rx="28" fill="none" stroke="#d8ff3e" stroke-opacity=".5"/>
    <text x="70" y="92" text-anchor="middle" style="font:800 64px 'Inter Tight','Inter',Helvetica,Arial,sans-serif;fill:#f4f4f2;letter-spacing:-3px">IS</text>
    <text x="118" y="42" text-anchor="middle" style="font:600 14px Helvetica,Arial,sans-serif;fill:#d8ff3e">®</text>
  </g></g>
</svg>
